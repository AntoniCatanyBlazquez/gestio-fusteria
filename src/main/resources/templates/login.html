<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Accés - Gestió Fusteria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #2D1B0E;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .login-brand {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-brand .icon {
            font-size: 3rem;
            color: #795548;
        }
        .login-brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2D1B0E;
            margin-top: 0.5rem;
            margin-bottom: 0.25rem;
        }
        .login-brand p {
            color: #999;
            font-size: 0.9rem;
            margin: 0;
        }
        .form-control:focus {
            border-color: #795548;
            box-shadow: 0 0 0 0.2rem rgba(121, 85, 72, 0.25);
        }
        .btn-login {
            background-color: #795548;
            color: white;
            border: none;
            padding: 0.75rem;
            font-size: 1rem;
            border-radius: 8px;
            width: 100%;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-login:hover {
            background-color: #5D4037;
            color: white;
        }
        .input-group-text {
            background: #f8f5f2;
            border-right: none;
            color: #795548;
        }
        .form-control {
            border-left: none;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-brand">
        <div class="icon"><i class="bi bi-tools"></i></div>
        <h1>Gestió Fusteria</h1>
        <p>Introdueix les teves credencials</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger py-2 text-center" role="alert">
        <i class="bi bi-exclamation-circle me-1"></i> Usuari o contrasenya incorrectes
    </div>
    <div th:if="${param.logout}" class="alert alert-success py-2 text-center" role="alert">
        <i class="bi bi-check-circle me-1"></i> Has tancat la sessió correctament
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small">USUARI</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" placeholder="Nom d'usuari" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold text-secondary small">CONTRASENYA</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Contrasenya" required>
            </div>
        </div>
        <button type="submit" class="btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
        </button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
