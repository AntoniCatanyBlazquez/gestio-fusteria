<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Nova factura - Gestió Fusteria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="main-content">
    <div class="page-header">
        <h2>Nova factura</h2>
        <p>Omple les dades per generar la factura</p>
    </div>

    <div class="card" style="max-width: 720px;">
        <div class="card-body p-4">
            <form th:action="@{/factures/nova}" method="post">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold">Client <span class="text-danger">*</span></label>
                        <select name="clientId" class="form-select" required>
                            <option value="">— Selecciona un client —</option>
                            <option th:each="c : ${clients}" th:value="${c.id}"
                                    th:text="${c.nom + ' ' + c.llinatge + (c.numeroIdentificacio != null ? ' (' + c.tipusIdentificacio + ': ' + c.numeroIdentificacio + ')' : '')}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Treballs a incloure <span class="text-danger">*</span></label>
                        <div class="border rounded p-3" style="max-height: 220px; overflow-y: auto; background:#fafafa;">
                            <div th:each="t : ${treballs}" class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" name="treballIds" th:value="${t.id}" th:id="'treball-' + ${t.id}">
                                <label class="form-check-label" th:for="'treball-' + ${t.id}"
                                       th:text="${t.titol + (t.preu != null ? ' — ' + t.preu + ' €' : '')}"></label>
                            </div>
                            <p th:if="${#lists.isEmpty(treballs)}" class="text-muted mb-0 small">No hi ha treballs disponibles</p>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Mètode de pagament</label>
                        <select name="metodePagament" class="form-select">
                            <option value="">— Selecciona —</option>
                            <option value="Transferència bancària">Transferència bancària</option>
                            <option value="Efectiu">Efectiu</option>
                            <option value="Targeta">Targeta</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Observacions</label>
                        <textarea name="observacions" class="form-control" rows="1" placeholder="Observacions addicionals..."></textarea>
                    </div>
                </div>
                <div class="alert alert-info mt-3 py-2" style="font-size:0.85rem;">
                    <i class="bi bi-info-circle me-1"></i>
                    El subtotal, IVA (21%), IRPF (15%) i total es calculen automàticament.
                </div>
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-wood"><i class="bi bi-file-earmark-check me-1"></i>Crear factura</button>
                    <a th:href="@{/factures}" class="btn btn-outline-secondary">Cancel·lar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
