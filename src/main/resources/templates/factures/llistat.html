<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Factures - Gestió Fusteria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="main-content">
    <div class="page-header d-flex justify-content-between align-items-start">
        <div>
            <h2>Factures</h2>
            <p>Historial de factures emeses</p>
        </div>
        <a th:href="@{/factures/nova}" class="btn btn-wood"><i class="bi bi-file-earmark-plus me-1"></i>Nova factura</a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover">
                <thead>
                    <tr><th>Núm.</th><th>Client</th><th>Data</th><th>Subtotal</th><th>IVA 21%</th><th>IRPF 15%</th><th class="fw-bold">Total</th><th>Pagament</th><th>Accions</th></tr>
                </thead>
                <tbody>
                    <tr th:each="factura : ${factures}">
                        <td class="fw-semibold" th:text="${factura.numeroFactura}"></td>
                        <td th:text="${factura.nomClient}"></td>
                        <td th:text="${factura.dataEmisio}"></td>
                        <td th:text="${factura.subtotal + ' €'}"></td>
                        <td th:text="${factura.iva + ' €'}"></td>
                        <td th:text="${factura.retencioIRPF + ' €'}"></td>
                        <td class="fw-bold" style="color:#2D1B0E;" th:text="${factura.total + ' €'}"></td>
                        <td>
                            <span th:if="${factura.metodePagament != null}" class="badge bg-secondary" th:text="${factura.metodePagament}"></span>
                            <span th:if="${factura.metodePagament == null}" class="text-muted">—</span>
                        </td>
                        <td>
                            <a th:href="@{/factures/{id}/pdf(id=${factura.id})}" class="btn btn-sm btn-outline-secondary me-1" target="_blank"><i class="bi bi-file-pdf"></i></a>
                            <form th:action="@{/factures/{id}/eliminar(id=${factura.id})}" method="post" style="display:inline;" onsubmit="return confirm('Eliminar aquesta factura?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(factures)}">
                        <td colspan="9" class="text-center text-muted py-5">
                            <i class="bi bi-receipt" style="font-size:2rem; display:block; margin-bottom:0.5rem;"></i>
                            No hi ha factures emeses
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
