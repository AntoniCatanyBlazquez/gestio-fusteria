<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Gestió Fusteria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="main-content">
    <div class="page-header">
        <h2>Dashboard</h2>
        <p>Resum general de la fusteria</p>
    </div>

    <!-- Comptadors -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card p-3 d-flex flex-row align-items-center gap-3">
                <div style="background:#fff3e0; border-radius:12px; padding:0.9rem;">
                    <i class="bi bi-people-fill" style="font-size:1.8rem; color:#795548;"></i>
                </div>
                <div>
                    <div style="font-size:2rem; font-weight:700; color:#2D1B0E;" th:text="${totalClients}">0</div>
                    <div class="text-muted" style="font-size:0.88rem;">Clients registrats</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 d-flex flex-row align-items-center gap-3">
                <div style="background:#e8f5e9; border-radius:12px; padding:0.9rem;">
                    <i class="bi bi-hammer" style="font-size:1.8rem; color:#388E3C;"></i>
                </div>
                <div>
                    <div style="font-size:2rem; font-weight:700; color:#2D1B0E;" th:text="${totalTreballs}">0</div>
                    <div class="text-muted" style="font-size:0.88rem;">Treballs actius</div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3 d-flex flex-row align-items-center gap-3">
                <div style="background:#e3f2fd; border-radius:12px; padding:0.9rem;">
                    <i class="bi bi-receipt" style="font-size:1.8rem; color:#0288D1;"></i>
                </div>
                <div>
                    <div style="font-size:2rem; font-weight:700; color:#2D1B0E;" th:text="${totalFactures}">0</div>
                    <div class="text-muted" style="font-size:0.88rem;">Factures emeses</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Accions ràpides -->
    <div class="card p-4">
        <h6 class="text-muted mb-3" style="font-size:0.78rem; text-transform:uppercase; letter-spacing:0.06em;">Accions ràpides</h6>
        <div class="d-flex gap-2 flex-wrap">
            <a th:href="@{/clients/nou}" class="btn btn-wood"><i class="bi bi-person-plus me-1"></i>Nou client</a>
            <a th:href="@{/treballs/nou}" class="btn btn-wood"><i class="bi bi-plus-circle me-1"></i>Nou treball</a>
            <a th:href="@{/factures/nova}" class="btn btn-wood"><i class="bi bi-file-earmark-plus me-1"></i>Nova factura</a>
            <a th:href="@{/calendari/nou}" class="btn btn-wood"><i class="bi bi-calendar-plus me-1"></i>Nou event</a>
            <a th:href="@{/estadistiques}" class="btn btn-outline-secondary"><i class="bi bi-bar-chart-line me-1"></i>Estadístiques</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
