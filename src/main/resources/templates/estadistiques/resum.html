<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Estadístiques - Gestió Fusteria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="main-content">
    <div class="page-header">
        <h2>Estadístiques</h2>
        <p>Resum econòmic i de producció</p>
    </div>

    <!-- Comptadors de treballs -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="text-muted small mb-1">Total treballs</div>
                <div style="font-size:2rem; font-weight:700; color:#2D1B0E;" th:text="${totalTreballs}">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="text-muted small mb-1">Pendents</div>
                <div style="font-size:2rem; font-weight:700; color:#F59E0B;" th:text="${pendents}">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="text-muted small mb-1">En curs</div>
                <div style="font-size:2rem; font-weight:700; color:#0288D1;" th:text="${enCurs}">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="text-muted small mb-1">Finalitzats</div>
                <div style="font-size:2rem; font-weight:700; color:#388E3C;" th:text="${finalitzats}">0</div>
            </div>
        </div>
    </div>

    <!-- Ingressos totals -->
    <div class="card p-4 mb-4 text-center">
        <div class="text-muted small mb-1">Ingressos totals (treballs finalitzats)</div>
        <div style="font-size:2.5rem; font-weight:700; color:#388E3C;" th:text="${ingressosTotals + ' €'}">0 €</div>
    </div>

    <div class="row g-4">
        <!-- Per client -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header" style="background-color:#795548; color:white;">
                    <i class="bi bi-people me-2"></i>Ingressos per client
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr><th>Client</th><th class="text-end">Import (€)</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="entry : ${perClient}">
                                <td th:text="${entry.key}"></td>
                                <td class="text-end fw-bold" th:text="${entry.value + ' €'}"></td>
                            </tr>
                            <tr th:if="${#maps.size(perClient) == 0}">
                                <td colspan="2" class="text-center text-muted py-3 small">Sense dades</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Per mes -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header" style="background-color:#795548; color:white;">
                    <i class="bi bi-calendar3 me-2"></i>Ingressos per mes
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover">
                        <thead class="table-light">
                            <tr><th>Mes</th><th class="text-end">Import (€)</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="entry : ${perMes}">
                                <td th:text="${entry.key}"></td>
                                <td class="text-end fw-bold" th:text="${entry.value + ' €'}"></td>
                            </tr>
                            <tr th:if="${#maps.size(perMes) == 0}">
                                <td colspan="2" class="text-center text-muted py-3 small">Sense dades</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
