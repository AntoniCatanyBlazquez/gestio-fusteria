<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Nova entrada - Gestió Fusteria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="main-content">
    <div class="page-header">
        <h2>Nova entrada al calendari</h2>
        <p>Planifica un event o entrega</p>
    </div>

    <div class="card" style="max-width: 600px;">
        <div class="card-body p-4">
            <form th:action="@{/calendari/nou}" method="post">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold">Títol <span class="text-danger">*</span></label>
                        <input type="text" name="titol" class="form-control" placeholder="Ex: Reunió amb client"
                               th:classappend="${errorTitol != null} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${errorTitol}" th:text="${errorTitol}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Treball associat <span class="text-danger">*</span></label>
                        <select name="treballId" class="form-select" th:classappend="${errorTreball != null} ? 'is-invalid' : ''">
                            <option value="">— Selecciona un treball —</option>
                            <option th:each="t : ${treballs}" th:value="${t.id}" th:text="${t.titol}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${errorTreball}" th:text="${errorTreball}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Data <span class="text-danger">*</span></label>
                        <input type="date" name="dateEntrada" class="form-control"
                               th:classappend="${errorData != null} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${errorData}" th:text="${errorData}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Comentaris</label>
                        <textarea name="comentaris" class="form-control" rows="3" placeholder="Notes o comentaris..."></textarea>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-wood"><i class="bi bi-check-lg me-1"></i>Guardar</button>
                    <a th:href="@{/calendari}" class="btn btn-outline-secondary">Cancel·lar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
