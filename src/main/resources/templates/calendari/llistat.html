<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Calendari - Gestió Fusteria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="main-content">
    <div class="page-header d-flex justify-content-between align-items-start">
        <div>
            <h2>Calendari</h2>
            <p>Planificació i entrades de treballs</p>
        </div>
        <a th:href="@{/calendari/nou}" class="btn btn-wood"><i class="bi bi-calendar-plus me-1"></i>Nova entrada</a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover">
                <thead>
                    <tr><th>Títol</th><th>Treball associat</th><th>Data</th><th>Comentaris</th><th>Accions</th></tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${calendaris}">
                        <td class="fw-semibold" th:text="${c.titol}"></td>
                        <td th:text="${c.treball != null ? c.treball.titol : '—'}"></td>
                        <td th:text="${c.dateEntrada}"></td>
                        <td th:text="${c.comentaris != null ? c.comentaris : '—'}"></td>
                        <td>
                            <form th:action="@{/calendari/{id}/eliminar(id=${c.id})}" method="post" style="display:inline;" onsubmit="return confirm('Eliminar aquesta entrada?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(calendaris)}">
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="bi bi-calendar3" style="font-size:2rem; display:block; margin-bottom:0.5rem;"></i>
                            No hi ha entrades al calendari
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
