<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title th:text="${titolPagina} + ' - Gestió Fusteria'">Client</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="main-content">
    <div class="page-header">
        <h2 th:text="${titolPagina}">Client</h2>
        <p>Omple les dades del client</p>
    </div>

    <div class="card" style="max-width: 620px;">
        <div class="card-body p-4">
            <form th:action="${client.id != null} ? @{/clients/{id}/editar(id=${client.id})} : @{/clients/nou}" method="post" th:object="${client}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nom <span class="text-danger">*</span></label>
                        <input type="text" name="nom" class="form-control" th:value="${client.nom}" placeholder="Nom del client"
                               th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Llinatge <span class="text-danger">*</span></label>
                        <input type="text" name="llinatge" class="form-control" th:value="${client.llinatge}" placeholder="Llinatge del client"
                               th:classappend="${#fields.hasErrors('llinatge')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('llinatge')}" th:errors="*{llinatge}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tipus d'identificació</label>
                        <select name="tipusIdentificacio" class="form-select">
                            <option value="">-- Selecciona --</option>
                            <option th:each="t : ${tipusIdentificacions}" th:value="${t}" th:text="${t}"
                                    th:selected="${client.tipusIdentificacio == t}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Número d'identificació</label>
                        <input type="text" name="numeroIdentificacio" class="form-control" th:value="${client.numeroIdentificacio}" placeholder="Ex: 12345678A">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Telèfon</label>
                        <input type="tel" name="telefon" class="form-control" th:value="${client.telefon}" placeholder="Ex: 600 123 456">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control" th:value="${client.email}" placeholder="client@email.com">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Adreça</label>
                        <input type="text" name="direccio" class="form-control" th:value="${client.direccio}" placeholder="Adreça completa">
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-wood"><i class="bi bi-check-lg me-1"></i>Guardar</button>
                    <a th:href="@{/clients}" class="btn btn-outline-secondary">Cancel·lar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
