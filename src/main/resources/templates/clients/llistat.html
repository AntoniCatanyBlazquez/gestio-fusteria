<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Clients - Gestió Fusteria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="main-content">
    <div class="page-header d-flex justify-content-between align-items-start">
        <div>
            <h2>Clients</h2>
            <p>Gestió del llistat de clients</p>
        </div>
        <a th:href="@{/clients/nou}" class="btn btn-wood"><i class="bi bi-person-plus me-1"></i>Nou client</a>
    </div>

    <form method="get" th:action="@{/clients}" class="mb-3">
        <div class="input-group" style="max-width: 420px;">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" name="query" class="form-control border-start-0" placeholder="Cercar per nom, llinatge, email o NIF..." th:value="${query}">
            <button class="btn btn-wood" type="submit">Cercar</button>
            <a th:href="@{/clients}" class="btn btn-outline-secondary">Netejar</a>
        </div>
    </form>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Nom</th><th>Llinatge</th><th>Identificació</th><th>Telèfon</th><th>Email</th><th>Adreça</th><th>Accions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="client : ${clients}">
                        <td th:text="${client.nom}"></td>
                        <td th:text="${client.llinatge}"></td>
                        <td th:text="${client.tipusIdentificacio != null ? client.tipusIdentificacio + ': ' + client.numeroIdentificacio : '—'}"></td>
                        <td th:text="${client.telefon}"></td>
                        <td th:text="${client.email}"></td>
                        <td th:text="${client.direccio}"></td>
                        <td>
                            <a th:href="@{/clients/{id}/editar(id=${client.id})}" class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/clients/{id}/eliminar(id=${client.id})}" method="post" style="display:inline;" onsubmit="return confirm('Eliminar aquest client?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clients)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-people" style="font-size:2rem; display:block; margin-bottom:0.5rem;"></i>
                            No hi ha clients registrats
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
