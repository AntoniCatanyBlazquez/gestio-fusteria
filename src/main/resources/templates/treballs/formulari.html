<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title th:text="${titolPagina} + ' - Gestió Fusteria'">Treball</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="main-content">
    <div class="page-header">
        <h2 th:text="${titolPagina}">Treball</h2>
        <p>Omple les dades del treball</p>
    </div>

    <div class="card" style="max-width: 680px;">
        <div class="card-body p-4">
            <form th:action="${treball.id != null} ? @{/treballs/{id}/editar(id=${treball.id})} : @{/treballs/nou}" method="post">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold">Títol <span class="text-danger">*</span></label>
                        <input type="text" name="titol" class="form-control" th:value="${treball.titol}" placeholder="Ex: Moble de cuina"
                               th:classappend="${errorTitol != null} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${errorTitol}" th:text="${errorTitol}"></div>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Descripció</label>
                        <textarea name="descripcio" class="form-control" rows="3" placeholder="Descripció del treball..." th:text="${treball.descripcio}"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Data <span class="text-danger">*</span></label>
                        <input type="date" name="data" class="form-control" th:value="${treball.data}"
                               th:classappend="${errorData != null} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${errorData}" th:text="${errorData}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Preu (€)</label>
                        <input type="number" name="preu" class="form-control" step="0.01" min="0" th:value="${treball.preu}" placeholder="0.00">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Estat</label>
                        <select name="estat" class="form-select">
                            <option th:each="e : ${estats}" th:value="${e}" th:text="${e}" th:selected="${e == treball.estat}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Client</label>
                        <select name="clientId" class="form-select">
                            <option value="">— Sense client —</option>
                            <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.nom + ' ' + c.llinatge}"
                                    th:selected="${treball.client != null and treball.client.id == c.id}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Materials</label>
                        <textarea name="materials" class="form-control" rows="2" placeholder="Llistat de materials usats..." th:text="${treball.materials}"></textarea>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-wood"><i class="bi bi-check-lg me-1"></i>Guardar</button>
                    <a th:href="@{/treballs}" class="btn btn-outline-secondary">Cancel·lar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
