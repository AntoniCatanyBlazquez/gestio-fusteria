<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Treballs - Gestió Fusteria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="main-content">
    <div class="page-header d-flex justify-content-between align-items-start">
        <div>
            <h2>Treballs</h2>
            <p>Gestió dels treballs de la fusteria</p>
        </div>
        <a th:href="@{/treballs/nou}" class="btn btn-wood"><i class="bi bi-plus-circle me-1"></i>Nou treball</a>
    </div>

    <form method="get" th:action="@{/treballs}" class="row g-2 mb-3">
        <div class="col-md-5">
            <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" name="query" class="form-control border-start-0" placeholder="Cercar per títol, descripció o materials..." th:value="${query}">
            </div>
        </div>
        <div class="col-md-3">
            <select name="estat" class="form-select">
                <option value="">Tots els estats</option>
                <option th:each="e : ${estats}" th:value="${e}" th:text="${e}" th:selected="${e == estatSeleccionat}"></option>
            </select>
        </div>
        <div class="col-auto"><button class="btn btn-wood" type="submit"><i class="bi bi-funnel me-1"></i>Filtrar</button></div>
        <div class="col-auto"><a th:href="@{/treballs}" class="btn btn-outline-secondary">Netejar</a></div>
    </form>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover">
                <thead>
                    <tr><th>Títol</th><th>Client</th><th>Data</th><th>Estat</th><th>Preu</th><th>Accions</th></tr>
                </thead>
                <tbody>
                    <tr th:each="treball : ${treballs}">
                        <td th:text="${treball.titol}"></td>
                        <td th:text="${treball.client != null ? treball.client.nom + ' ' + treball.client.llinatge : '—'}"></td>
                        <td th:text="${treball.data}"></td>
                        <td>
                            <span class="badge rounded-pill" th:classappend="'badge-' + ${treball.estat}" th:text="${treball.estat}"></span>
                        </td>
                        <td th:text="${treball.preu != null ? treball.preu + ' €' : '—'}"></td>
                        <td>
                            <a th:href="@{/treballs/{id}/editar(id=${treball.id})}" class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/treballs/{id}/eliminar(id=${treball.id})}" method="post" style="display:inline;" onsubmit="return confirm('Eliminar aquest treball?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(treballs)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="bi bi-hammer" style="font-size:2rem; display:block; margin-bottom:0.5rem;"></i>
                            No hi ha treballs registrats
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
